[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deribit_wrapper"
version = "0.6.1"
description = "A Python wrapper for seamless integration with Deribit's trading API, offering easy access to market data, account management, and trading operations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Antonio Ventilii", email = "antonioventilii@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "urllib3",
    "progressbar2",
    "cryptography>=42.0.0",
]
keywords = ["deribit", "api", "wrapper", "cryptocurrency", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AntonioVentilii/deribit-wrapper"
"Source Code" = "https://github.com/AntonioVentilii/deribit-wrapper"
"Issue Tracker" = "https://github.com/AntonioVentilii/deribit-wrapper/issues"

[tool.setuptools.packages.find]
include = ["deribit_wrapper*"]

[tool.setuptools.package-data]
deribit_wrapper = ["py.typed"]

[tool.mypy]
files = ["deribit_wrapper"]
# The package ships py.typed, so annotations are part of the public contract and
# CI must keep them honest. These codes are the residue of adopting mypy on an
# existing codebase - mostly the pandas DataFrame surface - and are meant to be
# removed one at a time, the way the pydocstyle D1xx ignores were.
disable_error_code = [
    "arg-type",
    "assignment",
    "call-arg",
    "call-overload",
    "dict-item",
    "index",
    "list-item",
    "operator",
    "return-value",
    "union-attr",
    "var-annotated",
]
