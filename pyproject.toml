[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deribit_wrapper"
version = "0.6.2"
description = "A Python wrapper for seamless integration with Deribit's trading API, offering easy access to market data, account management, and trading operations."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Antonio Ventilii", email = "antonioventilii@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "urllib3",
    "progressbar2",
    "cryptography>=42.0.0",
]
keywords = ["deribit", "api", "wrapper", "cryptocurrency", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AntonioVentilii/deribit-wrapper"
"Source Code" = "https://github.com/AntonioVentilii/deribit-wrapper"
"Issue Tracker" = "https://github.com/AntonioVentilii/deribit-wrapper/issues"

[tool.setuptools.packages.find]
include = ["deribit_wrapper*"]

[tool.setuptools.package-data]
deribit_wrapper = ["py.typed"]

[tool.mypy]
files = ["deribit_wrapper"]
# The package ships py.typed, so annotations are part of the public contract and
# CI must keep them honest. These codes are the residue of adopting mypy on an
# existing codebase - mostly the pandas DataFrame surface - and are meant to be
# removed one at a time, the way the pydocstyle D1xx ignores were.

# Suppressions are scoped per module so the rest of the package stays strict.
# market_data and account_management are the pandas DataFrame surface; the
# authentication entry covers cryptography's broad private-key union and goes
# away once the key loading is centralised.
[[tool.mypy.overrides]]
module = "deribit_wrapper.market_data"
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "index",
    "operator",
    "return-value",
    "union-attr",
]

[[tool.mypy.overrides]]
module = "deribit_wrapper.account_management"
disable_error_code = ["assignment", "list-item", "return-value", "var-annotated"]

[[tool.mypy.overrides]]
module = "deribit_wrapper.authentication"
disable_error_code = ["arg-type", "call-arg", "union-attr"]

[[tool.mypy.overrides]]
module = "deribit_wrapper.trading"
disable_error_code = ["assignment"]
