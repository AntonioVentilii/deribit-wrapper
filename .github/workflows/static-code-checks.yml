name: Static Code Checks
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [ created ]

jobs:
  format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check format
        run: |
          make check-format

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: |
          make lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # type checking is version-independent here, so it runs once rather than
      # across the matrix; numpy's stubs also require a modern interpreter
      - name: Set up Python
        uses: ./.github/actions/prepare
        with:
          python-version: '3.13'

      - name: Typecheck
        run: |
          make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        env:
          TEST_CLIENT_ID: ${{ secrets.TEST_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
        run: |
          make test

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python-version }}

      - name: Docs style
        run: |
          make docs

  checks-pass:
    needs: [ 'format', 'lint', 'typecheck', 'test', 'docs' ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fail if any required check did not succeed
        uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
