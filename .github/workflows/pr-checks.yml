name: PR Checks

permissions: {}

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check-pr-title:
    name: Check PR title
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # The repository squash-merges, so the PR title becomes the commit
      # message release-please reads. A type it does not recognise is silently
      # dropped: no release, and no changelog entry, even for a bug fix. The
      # types below are exactly the changelog-sections in
      # release-please-config.json, so the two cannot drift apart.
      - name: Check PR title
        run: |
          TYPES='feat|fix|perf|deps|revert|refactor|docs|build|ci|test|style|chore'
          PATTERN="^($TYPES)(\([-a-zA-Z0-9,]+\))?!?: .+"
          if [[ "$TITLE" =~ $PATTERN ]]; then
              echo "PR title passes."
          else
              echo "PR title does not follow conventional commits:"
              echo ""
              echo "    $TITLE"
              echo ""
              echo "Expected:  type: description"
              echo "  or:      type(scope): description"
              echo "  or:      type(scope)!: description   (breaking change)"
              echo ""
              echo "Allowed types: ${TYPES//|/, }"
              echo ""
              echo "The title becomes the squashed commit message, and"
              echo "release-please ignores any type it does not recognise -"
              echo "so an unlisted type ships with no release and no changelog."
              exit 1
          fi
